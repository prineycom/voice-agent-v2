name: Unsigned release candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          fetch-depth: 0
      - name: Set up launcher Node
        uses: actions/setup-node@v4
        timeout-minutes: 1
        with:
          node-version: "26"
      - name: Build test-root launcher twice and prove reproducibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/voice-agent-rc"
          common=(--public-key launcher/keys/release-fixture-ed25519-public.pem --channel-url https://releases.example.invalid/voice-agent/stable.json --launcher-version 0.8.0 --launcher-protocol 1 --source-timestamp 2026-08-20T00:00:00Z --source-commit "$(git rev-parse HEAD)")
          launcher/build --output "$RUNNER_TEMP/voice-agent-rc/voice-agent.one" "${common[@]}"
          launcher/build --output "$RUNNER_TEMP/voice-agent-rc/voice-agent.two" "${common[@]}" --compare "$RUNNER_TEMP/voice-agent-rc/voice-agent.one"
          cmp "$RUNNER_TEMP/voice-agent-rc/voice-agent.one.provenance.json" "$RUNNER_TEMP/voice-agent-rc/voice-agent.two.provenance.json"
      - name: Verify archive, SBOM, signing isolation, publication refusal, and lifecycle fixtures
        run: launcher/test/run launcher/test/release-source.test.cjs release/release.test.cjs launcher/test/install.test.cjs launcher/test/update.test.cjs
      - name: Assert workflow has no signing or publication authority
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const paths = fs.readdirSync('.github/workflows').map((name) => `.github/workflows/${name}`);
          const forbidden = ['BEGIN' + ' PRIVATE KEY', 'BEGIN' + ' ENCRYPTED PRIVATE KEY', 'gh-axi' + ' release create', 'gh-axi' + ' release upload', 'sign-' + 'channel'];
          for (const filename of paths) {
            const text = fs.readFileSync(filename, 'utf8');
            for (const marker of forbidden) if (text.includes(marker)) throw new Error(`forbidden workflow authority: ${filename}`);
          }
          NODE
          test ! -e "$RUNNER_TEMP/voice-agent-rc/stable.json.sig"
