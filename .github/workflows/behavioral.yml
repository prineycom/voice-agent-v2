name: Behavioral verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        timeout-minutes: 1
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        timeout-minutes: 1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install bounded test dependencies without running checks or builds
        timeout-minutes: 2
        run: ./setup-test-runtime
      - name: Run the one canonical PR gate
        timeout-minutes: 2
        run: ./verify
