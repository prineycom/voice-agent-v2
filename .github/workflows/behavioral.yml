name: Behavioral verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        timeout-minutes: 1
        with:
          python-version: "3.12"
      - name: Set up launcher Node
        uses: actions/setup-node@v4
        timeout-minutes: 1
        with:
          node-version: "26"
      - name: Record launcher Node
        run: echo "VOICE_AGENT_SEA_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Set up application Node
        uses: actions/setup-node@v4
        timeout-minutes: 1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore pinned test-runtime cache
        uses: actions/cache@v4
        timeout-minutes: 1
        with:
          path: ~/.cache/voice-agent-v2/slice-6
          key: pr-test-runtime-${{ runner.os }}-py312-node22-launcher26-${{ hashFiles('requirements-slice6.lock', 'web/package-lock.json', 'setup-test-runtime') }}
      - name: Install bounded test dependencies without running checks or builds
        timeout-minutes: 2
        run: ./setup-test-runtime
      - name: Run the one canonical PR gate
        timeout-minutes: 3
        run: ./verify
