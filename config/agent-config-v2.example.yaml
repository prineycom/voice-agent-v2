schema_version: voice-agent.config.v2
agent:
  # First install and legacy adoption keep this optional capability disabled.
  enabled: false
  max_decisions: 24
  active_deadline_seconds: 600
  tools:
    - shell.exec
    - file.read
    - file.search
    - file.write
    - file.edit
    - file.patch
    - execute_code
    - process
    - receipt
    - web.search
    - web.fetch
    - web.extract
    - report.artifact
    - report.deliver
agent_environment:
  enabled: false
  docker:
    # Set only after the launcher verifies the exact owner-only rootless socket,
    # daemon/user namespace/cgroup identity, and generated-service endpoint.
    endpoint: null
    authority: explicit_verified_rootless
  image:
    reference: ghcr.io/prineycom/voice-agent-environment@sha256:8a5a972b25f7c203c71b8e28af17f756d9daf39bc74ebbc5d86eaf6c9f3da421
    spec_digest: sha256:0bce866d8050e9c204131cd68441b766ed4ac19150620ec5fbdb3c60ccaaabc9
    pull_at_runtime: false
  identity:
    # The installer writes its stable ID and canonical XDG data paths here. It
    # never guesses an environment/container, mount, credential, or recipient.
    installation_id: null
    registry_path: null
    rootfs_storage_path: null
    workspace_path: null
    cache_path: null
  lifecycle:
    lazy_create: true
    persistent: true
    restart_policy: "no"
    idle_action: none
    command_timeout_seconds: 120
    command_timeout_grace_seconds: 5
  # Sources are explicit typed authority. RO is readable/exfiltratable; RW may
  # be changed/deleted. No ambient home, Docker socket, or user mounts exist.
  additional_mounts: []
  network:
    enabled: false
    mode: rootless_private
    publish_ports: []
  credentials:
    # Names only live here; values remain in the private referenced document.
    store_reference: private/credentials.json
    creation_environment_names: []
    creation_file_names: []
    exec_environment_names: []
    exec_file_names: []
  resources:
    cpus: 2
    memory_mib: 4096
    pids: 128
    shm_mib: 1024
    rootfs_target_mib: 4096
    workspace_target_mib: 5120
    cache_target_mib: 2048
    host_free_reserve_mib: 8192
    watchdog_interval_seconds: 2
    maximum_output_bytes: 262144
    maximum_stream_bytes: 262144
    stream_timeout_seconds: 120
